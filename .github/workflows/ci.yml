name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Swift toolchain
        run: swift --version
      - name: Core tests
        run: swift test
      - name: CocoaSpice overlay tests
        if: success() || failure()
        run: python3 -m unittest discover -s BuildSupport/cocoaspice -p 'test_*.py'

  app:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Xcode
        run: xcodebuild -version
      - name: Install native dependencies
        run: brew install pkgconf spice-gtk glib gstreamer
      - name: Prepare CocoaSpice and linker settings
        run: |
          ./BuildSupport/bootstrap-cocoaspice.sh
          ./BuildSupport/generate-xcconfig.sh
      - name: Debug build
        run: xcodebuild -project MacRemoteViewer.xcodeproj -scheme MacRemoteViewer -configuration Debug -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/mrv-debug" CODE_SIGNING_ALLOWED=NO build
      - name: Release build
        if: success() || failure()
        run: xcodebuild -project MacRemoteViewer.xcodeproj -scheme MacRemoteViewer -configuration Release -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/mrv-release" CODE_SIGNING_ALLOWED=NO build
