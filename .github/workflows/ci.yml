name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Swift toolchain
        run: swift --version
      - name: Core tests
        run: swift test
      - name: CocoaSpice overlay tests
        if: success() || failure()
        run: python3 -m unittest discover -s BuildSupport/cocoaspice -p 'test_*.py'
      - name: Portable packaging tests
        if: success() || failure()
        run: python3 -m unittest discover -s BuildSupport -p 'test_package_portable.py'

  spice-source-audit:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Install locked spice-gtk keg and candidate build tools
        run: brew install spice-gtk pkgconf meson ninja gettext gobject-introspection vala
      - name: Verify upstream archive and capture receive path evidence
        run: python3 BuildSupport/audit-spice-source.py --output "$RUNNER_TEMP/spice-source-audit"
      - name: Apply candidate bounds to verified upstream sources and test shared limit policy
        run: |
          python3 BuildSupport/spice-receive-candidate.py --audit "$RUNNER_TEMP/spice-source-audit"
          xcrun clang -std=c11 -Wall -Wextra -Werror $(pkg-config --cflags glib-2.0) BuildSupport/test-spice-receive-limits.c -o "$RUNNER_TEMP/spice-receive-limits" $(pkg-config --libs glib-2.0)
          "$RUNNER_TEMP/spice-receive-limits"
      - name: Build candidate in isolated prefix and compare ABI
        run: |
          python3 -m venv "$RUNNER_TEMP/spice-build-venv"
          "$RUNNER_TEMP/spice-build-venv/bin/python" -m pip install 'pyparsing==3.3.3' 'meson==1.12.1'
          export PATH="$RUNNER_TEMP/spice-build-venv/bin:$PATH"
          "$RUNNER_TEMP/spice-build-venv/bin/python" BuildSupport/build-spice-candidate.py --audit "$RUNNER_TEMP/spice-source-audit" --work "$RUNNER_TEMP/spice-candidate-build"
      - name: Upload source audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spice-gtk-source-audit
          path: ${{ runner.temp }}/spice-source-audit/
          if-no-files-found: error
          retention-days: 14

      - name: Upload candidate dylib for isolated regression only
        uses: actions/upload-artifact@v4
        with:
          name: spice-gtk-candidate-native-test-only
          path: |
            ${{ runner.temp }}/spice-candidate-build/prefix/lib/libspice-client-glib-2.0.8.dylib
            ${{ runner.temp }}/spice-source-audit/native-build-report.json
          if-no-files-found: error
          retention-days: 14

  app:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Xcode and host architecture
        run: |
          xcodebuild -version
          test "$(uname -m)" = arm64
      - name: Install native dependencies
        run: brew install pkgconf spice-gtk glib gstreamer
      - name: Check locked native dependencies and record environment
        run: python3 BuildSupport/check-dependencies.py --strict --output "$RUNNER_TEMP/native-build.json"
      - name: Prepare CocoaSpice and linker settings
        run: |
          ./BuildSupport/bootstrap-cocoaspice.sh
          ./BuildSupport/generate-xcconfig.sh
      - name: Validate patched CocoaSpice GPU lifetime invariants
        run: python3 BuildSupport/cocoaspice/check_gpu_lifetime.py ThirdParty/CocoaSpice
      - name: Debug build
        run: xcodebuild -project MacRemoteViewer.xcodeproj -scheme MacRemoteViewer -configuration Debug -destination 'platform=macOS,arch=arm64' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES -derivedDataPath "$RUNNER_TEMP/mrv-debug" CODE_SIGNING_ALLOWED=NO build
      - name: Verify Debug executable architecture
        run: test "$(lipo -archs "$RUNNER_TEMP/mrv-debug/Build/Products/Debug/Mac Remote Viewer.app/Contents/MacOS/Mac Remote Viewer")" = arm64
      - name: Release build
        if: success() || failure()
        run: xcodebuild -project MacRemoteViewer.xcodeproj -scheme MacRemoteViewer -configuration Release -destination 'platform=macOS,arch=arm64' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES -derivedDataPath "$RUNNER_TEMP/mrv-release" CODE_SIGNING_ALLOWED=NO build
      - name: Verify Release executable architecture
        run: test "$(lipo -archs "$RUNNER_TEMP/mrv-release/Build/Products/Release/Mac Remote Viewer.app/Contents/MacOS/Mac Remote Viewer")" = arm64

      - name: Package verified Release app
        run: python3 BuildSupport/package-portable.py --app "$RUNNER_TEMP/mrv-release/Build/Products/Release/Mac Remote Viewer.app"
      - name: Validate CycloneDX schema and signed bundle inventory
        run: |
          python3 -m venv "$RUNNER_TEMP/sbom-venv"
          "$RUNNER_TEMP/sbom-venv/bin/python" -m pip install 'jsonschema==4.25.1'
          "$RUNNER_TEMP/sbom-venv/bin/python" BuildSupport/validate-sbom.py dist/*.bom.json --app "dist/work/Mac Remote Viewer.app"
      - name: Audit bundled keg versions, notices and OSV advisories
        run: python3 BuildSupport/audit-dependencies.py dist/*.bom.json --manifest "$RUNNER_TEMP/native-build.json"
      - name: Verify DMG checksum
        run: |
          cd dist
          shasum -a 256 -c *.dmg.sha256 *.bom.json.sha256 *.dependency-audit.json.sha256 *.notices.zip.sha256
      - name: Mount final DMG and verify signed contents
        run: python3 BuildSupport/verify-dmg.py dist/*.dmg --bom dist/*.bom.json
      - name: Smoke test copied app from final DMG
        run: python3 BuildSupport/verify-dmg.py dist/*.dmg --bom dist/*.bom.json --smoke
      - name: Exercise real SPICE TLS link on loopback
        run: python3 BuildSupport/test-loopback-tls.py --app "dist/work/Mac Remote Viewer.app"
      - name: Install test-only SPICE server
        run: brew install spice-server spice-protocol
      - name: Exercise real SPICE ticket authentication and reconnect
        run: python3 BuildSupport/test-spice-auth.py --app "dist/work/Mac Remote Viewer.app"
      - name: Upload ad-hoc signed preview DMG, SBOM and build provenance
        uses: actions/upload-artifact@v4
        with:
          name: MacRemoteViewer-arm64-preview
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
            dist/*.bom.json
            dist/*.bom.json.sha256
            dist/*.dependency-audit.json
            dist/*.dependency-audit.json.sha256
            dist/*.notices.zip
            dist/*.notices.zip.sha256
            ${{ runner.temp }}/native-build.json
          if-no-files-found: error
          retention-days: 14

  spice-candidate-runtime:
    needs: [spice-source-audit, app]
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Download baseline preview
        uses: actions/download-artifact@v4
        with:
          name: MacRemoteViewer-arm64-preview
          path: baseline-preview
      - name: Download isolated candidate binary
        uses: actions/download-artifact@v4
        with:
          name: spice-gtk-candidate-native-test-only
          path: candidate-native
      - name: Install test-only native dependencies
        run: brew install pkgconf spice-gtk spice-server spice-protocol
      - name: Stage isolated candidate app from verified baseline DMG
        id: stage_candidate
        run: |
          python3 BuildSupport/stage-spice-candidate-app.py --baseline baseline-preview --candidate candidate-native --output "$RUNNER_TEMP/spice-candidate-runtime"
      - name: Exercise candidate real TLS link
        run: python3 BuildSupport/test-loopback-tls.py --app "$RUNNER_TEMP/spice-candidate-runtime/Mac Remote Viewer.app"
      - name: Verify candidate native link reply receive bounds on TLS loopback
        run: python3 BuildSupport/test-spice-receive-link.py --app "$RUNNER_TEMP/spice-candidate-runtime/Mac Remote Viewer.app"
      - name: Verify candidate native authenticated wire receive bounds
        run: python3 BuildSupport/test-spice-receive-wire.py --app "$RUNNER_TEMP/spice-candidate-runtime/Mac Remote Viewer.app"
      - name: Exercise candidate real SPICE authentication, display, clipboard and workspace
        if: ${{ !cancelled() && steps.stage_candidate.outcome == 'success' }}
        run: python3 BuildSupport/test-spice-auth.py --app "$RUNNER_TEMP/spice-candidate-runtime/Mac Remote Viewer.app"
      - name: Upload candidate runtime staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spice-gtk-candidate-runtime-evidence
          path: |
            ${{ runner.temp }}/spice-candidate-runtime/staging-report.json
            ${{ runner.temp }}/spice-candidate-runtime/startup.stdout.txt
            ${{ runner.temp }}/spice-candidate-runtime/startup.stderr.txt
          if-no-files-found: warn
          retention-days: 14
