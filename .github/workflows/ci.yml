name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Swift toolchain
        run: swift --version
      - name: Core tests
        run: swift test
      - name: CocoaSpice overlay tests
        if: success() || failure()
        run: python3 -m unittest discover -s BuildSupport/cocoaspice -p 'test_*.py'
      - name: Portable packaging tests
        if: success() || failure()
        run: python3 -m unittest discover -s BuildSupport -p 'test_package_portable.py'

  app:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Xcode and host architecture
        run: |
          xcodebuild -version
          test "$(uname -m)" = arm64
      - name: Install native dependencies
        run: brew install pkgconf spice-gtk glib gstreamer
      - name: Check locked native dependencies and record environment
        run: python3 BuildSupport/check-dependencies.py --strict --output "$RUNNER_TEMP/native-build.json"
      - name: Prepare CocoaSpice and linker settings
        run: |
          ./BuildSupport/bootstrap-cocoaspice.sh
          ./BuildSupport/generate-xcconfig.sh
      - name: Debug build
        run: xcodebuild -project MacRemoteViewer.xcodeproj -scheme MacRemoteViewer -configuration Debug -destination 'platform=macOS,arch=arm64' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES -derivedDataPath "$RUNNER_TEMP/mrv-debug" CODE_SIGNING_ALLOWED=NO build
      - name: Verify Debug executable architecture
        run: test "$(lipo -archs "$RUNNER_TEMP/mrv-debug/Build/Products/Debug/Mac Remote Viewer.app/Contents/MacOS/Mac Remote Viewer")" = arm64
      - name: Release build
        if: success() || failure()
        run: xcodebuild -project MacRemoteViewer.xcodeproj -scheme MacRemoteViewer -configuration Release -destination 'platform=macOS,arch=arm64' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES -derivedDataPath "$RUNNER_TEMP/mrv-release" CODE_SIGNING_ALLOWED=NO build
      - name: Verify Release executable architecture
        run: test "$(lipo -archs "$RUNNER_TEMP/mrv-release/Build/Products/Release/Mac Remote Viewer.app/Contents/MacOS/Mac Remote Viewer")" = arm64

      - name: Package verified Release app
        run: python3 BuildSupport/package-portable.py --app "$RUNNER_TEMP/mrv-release/Build/Products/Release/Mac Remote Viewer.app"
      - name: Verify DMG checksum
        run: |
          cd dist
          shasum -a 256 -c *.dmg.sha256
      - name: Upload unsigned preview DMG and build provenance
        uses: actions/upload-artifact@v4
        with:
          name: MacRemoteViewer-arm64-preview
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
            ${{ runner.temp }}/native-build.json
          if-no-files-found: error
          retention-days: 14
