name: Draft Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (vMAJOR.MINOR.PATCH)"
        required: true
        type: string
      ci_run_id:
        description: "Successful CI run ID for the tagged main commit"
        required: true
        type: string
      reviewed_distribution:
        description: "Licensing, PVE runtime tests and distribution readiness reviewed"
        type: boolean
        default: false
        required: true

permissions:
  contents: read
  actions: read

jobs:
  draft:
    if: github.ref == 'refs/heads/main' && inputs.reviewed_distribution
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      RUN_ID: ${{ inputs.ci_run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Explicit fail-closed hold until a reviewed, evidence-bound candidate
      # distribution artifact exists. A checkbox alone cannot clear it.
      - name: Block distribution until candidate promotion and source review
        shell: bash
        run: |
          echo "::error::Distribution disabled: candidate promotion, corresponding-source and license evidence gate are incomplete."
          exit 1
      - name: Verify existing tag and successful CI provenance
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          TAG_SHA="$(git rev-list -n 1 "refs/tags/$TAG")"
          git merge-base --is-ancestor "$TAG_SHA" HEAD
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/run.json"
          jq -e --arg sha "$TAG_SHA" '.conclusion == "success" and .head_sha == $sha and .head_branch == "main" and .path == ".github/workflows/ci.yml"' "$RUNNER_TEMP/run.json"
      - name: Download the verified build artifact
        run: gh run download "$RUN_ID" --name MacRemoteViewer-arm64-preview --dir release-artifact
      - name: Validate package and create a draft only
        shell: bash
        run: |
          set -euo pipefail
          DMG="MacRemoteViewer-$(echo "$TAG" | cut -c2-)-arm64.dmg"
          DMG_PATH="$(find release-artifact -type f -name "$DMG" -print)"
          test -f "$DMG_PATH"
          test -f "$DMG_PATH.sha256"
          (cd "$(dirname "$DMG_PATH")"; shasum -a 256 -c "$DMG.sha256")
          hdiutil verify "$DMG_PATH"
          BOM_PATH="${DMG_PATH%.dmg}.bom.json"
          test -f "$BOM_PATH"
          test -f "$BOM_PATH.sha256"
          (cd "$(dirname "$BOM_PATH")"; shasum -a 256 -c "$(basename "$BOM_PATH").sha256")
          python3 -m venv "$RUNNER_TEMP/sbom-venv"
          "$RUNNER_TEMP/sbom-venv/bin/python" -m pip install 'jsonschema==4.25.1'
          "$RUNNER_TEMP/sbom-venv/bin/python" BuildSupport/validate-sbom.py "$BOM_PATH"
          python3 BuildSupport/verify-dmg.py "$DMG_PATH" --bom "$BOM_PATH"
          AUDIT_PATH="${DMG_PATH%.dmg}.dependency-audit.json"
          NOTICES_PATH="${DMG_PATH%.dmg}.notices.zip"
          test -f "$AUDIT_PATH"
          test -f "$NOTICES_PATH"
          (cd "$(dirname "$AUDIT_PATH")"; shasum -a 256 -c "$(basename "$AUDIT_PATH").sha256" "$(basename "$NOTICES_PATH").sha256")
          BOM_SHA="$(shasum -a 256 "$BOM_PATH" | cut -d ' ' -f 1)"
          NOTICES_SHA="$(shasum -a 256 "$NOTICES_PATH" | cut -d ' ' -f 1)"
          jq -e --arg bom "$BOM_SHA" --arg notices "$NOTICES_SHA" '.scan_complete_for_observed_kegs == true and .sbom_sha256 == $bom and .notice_archive_sha256 == $notices and .release_review_required == true' "$AUDIT_PATH"
          python3 BuildSupport/audit-dependencies.py "$BOM_PATH" --verify-report "$AUDIT_PATH" --notices "$NOTICES_PATH" --require-complete
          MANIFEST="$(find release-artifact -type f -name native-build.json -print)"
          test -f "$MANIFEST"
          gh release create "$TAG" "$DMG_PATH" "$DMG_PATH.sha256" "$BOM_PATH" "$BOM_PATH.sha256" "$AUDIT_PATH" "$AUDIT_PATH.sha256" "$NOTICES_PATH" "$NOTICES_PATH.sha256" "$MANIFEST" --verify-tag --draft --title "Mac Remote Viewer $TAG" --notes "Ad-hoc signed ARM64 build; not notarized. Review the draft and distribution requirements before publishing."
