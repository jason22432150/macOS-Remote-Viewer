# 原生依賴基準：CI 45338041090（macOS 15 / Xcode 16.4 / SDK 15.5）。
# host 為原開發環境紀錄；不代表所有版本均可運行。

[host]
cpu = "arm64"
macos = "27.0.1"
xcode = "27.1"
# 產品規劃仍為 14.0；Homebrew bottle 以本機 SDK 建置，原型 xcconfig 跟 SDK，避免 ld version 警告。
deployment_target = "14.0"

[cocoaspice]
repository = "https://github.com/utmapp/CocoaSpice"
revision = "d8d29fc810047a3ddcebb351cdadc8fe4b4f308d"
date = "2026-09-22"
product = "CocoaSpiceNoUsb"
license = "Apache-2.0"

[spice_gtk]
source = "homebrew"
formula = "spice-gtk"
version = "0.43_1"
upstream_url = "https://www.spice-space.org/download/gtk/spice-gtk-0.43.tar.xz"
upstream_sha256 = "cee26e5b2d22909f35b40a94398d1e863ca3962ee46494ca97aab206abc3203b"
note = "原型以 overlay 相容：CSMain 使用 g_main_context_default()，gst_ios_init 改呼叫 gst_init。缺少 UTM fork 的 spice_util_set_main_context 與靜態 gst_plugin_*_register。"

[glib]
source = "homebrew"
formula = "glib"
version = "2.90.1"

[gstreamer]
source = "homebrew"
formula = "gstreamer"
version = "1.28.9"
note = "音訊功能第一版關閉，但仍需連結此依賴。"
